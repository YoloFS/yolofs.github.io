<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YoloFS social card</title>
<!-- Matches the demo video's cover (../demo/demo.html, scene 0) at 1200x630. -->
<style>
  :root { --fg: #1a1a1a; --muted: #666; --red: #c5050c; --good: #1f7a3f; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; overflow: hidden;
    padding: 0 64px; display: flex; flex-direction: column; justify-content: center; border-top: 12px solid var(--red);
    background: #fafaf7; color: var(--fg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 24px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .top b { color: var(--fg); letter-spacing: 0; text-transform: none; font-size: 26px; }
  h1 { font-size: 64px; font-weight: 800; line-height: 1.05; letter-spacing: -.03em; margin: 30px 0 0; white-space: nowrap; }
  .red { color: var(--red); }
  .quote { margin-top: 36px; padding: 4px 0 4px 28px; border-left: 8px solid var(--red); }
  .quote q { display: block; font-size: 44px; font-weight: 700; letter-spacing: -.02em; }
  .quote span { display: block; margin-top: 6px; font-size: 32px; font-weight: 500; }
  .quote em { font-style: normal; font-weight: 700; color: var(--red); }
  .fix { margin-top: 32px; font-size: 32px; font-weight: 700; color: var(--good); line-height: 1.35; }
  .fix ul { margin: 2px 0 0; padding: 0; list-style: none; }
  .fix li::before { content: "✓ "; }
</style>
</head>
<body>
  <div class="top"><span>SOSP 2026 · Prague</span><b>yolofs.github.io</b></div>
  <h1>Don't Let AI Agents <span class="red">YOLO</span> Your Files</h1>
  <div class="quote">
    <q>No problems occurred.</q>
    <span>— an AI agent, right after <em>erasing a file</em></span>
  </div>
  <div class="fix">With YoloFS:<ul><li>agents self-correct, undoing their own mistakes</li><li>your secrets stay locked until you say yes</li></ul></div>
</body>
</html>
