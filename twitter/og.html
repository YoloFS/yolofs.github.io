<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YoloFS social card</title>
<style>
  :root { --fg: #1a1a1a; --muted: #666; --line: #e5e5e5; --red: #c5050c; --info: #1d5fb4; --ctrl: #b85c00; --good: #1f7a3f; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; overflow: hidden;
    padding: 0 64px; display: flex; flex-direction: column; justify-content: center; border-top: 12px solid var(--red);
    background: #fff; color: var(--fg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .venue { font-size: 28px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 64px; font-weight: 800; line-height: 1.1; letter-spacing: -.03em; margin: 28px 0 0; white-space: nowrap; }
  .red { color: var(--red); }
  .good { color: var(--good); }
  .sub { font-size: 41px; font-weight: 500; letter-spacing: -.01em; margin: 14px 0 0; color: #333; white-space: nowrap; }
  .info { color: var(--info); font-weight: 700; }
  .ctrl { color: var(--ctrl); font-weight: 700; }
  .quote { margin-top: 52px; padding: 6px 0 6px 32px; border-left: 8px solid var(--red); }
  .quote q { display: block; font-size: 46px; font-weight: 700; letter-spacing: -.02em; quotes: "\201C" "\201D"; }
  .quote span { display: block; margin-top: 8px; font-size: 32px; color: #333; }
  .fix { margin: 40px 0 0; font-size: 40px; font-weight: 700; color: var(--good); }
  :root { --good: #1f7a3f; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .url { font-size: 28px; font-weight: 700; }
</style>
</head>
<body>
  <div class="top"><span class="venue">SOSP 2026 · Prague</span><span class="url">yolofs.github.io</span></div>
  <h1>Don't Let AI Agents <span class="red">YOLO</span> Your Files</h1>
  <p class="sub"><span class="info">Information</span> and <span class="ctrl">Control</span> in Agent-Native Filesystems</p>
  <div class="quote">
    <q>No problems occurred.</q>
    <span>— an AI agent, right after erasing a file</span>
  </div>
  <p class="fix">With YoloFS, agents see the damage and undo it.</p>
</body>
</html>
